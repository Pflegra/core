<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ersteinrichtung – Pflegra</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.10);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        .login-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2C5F8A;
            margin-bottom: .25rem;
        }
        .login-sub {
            font-size: .85rem;
            color: #888;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-size: .85rem;
            font-weight: 500;
            color: #444;
            margin-bottom: .35rem;
        }
        input[type=password] {
            width: 100%;
            padding: .6rem .85rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color .15s;
        }
        input[type=password]:focus { border-color: #2C5F8A; }
        .btn {
            width: 100%;
            padding: .7rem;
            background: #2C5F8A;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.25rem;
            transition: background .15s;
        }
        .btn:hover { background: #1e4a6e; }
        .fehler {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            padding: .65rem .85rem;
            font-size: .88rem;
            margin-bottom: 1rem;
        }
        .hinweis {
            background: #e8f0f8;
            color: #2C5F8A;
            border-radius: 8px;
            padding: .65rem .85rem;
            font-size: .82rem;
            margin-top: 1.25rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
        <div class="login-logo">🏥 Pflegra</div>
    <div class="login-sub">Ersteinrichtung — Admin-Account anlegen</div>

    {% if fehler %}
    <div class="fehler">⚠️ {{ fehler }}</div>
    {% endif %}

    <form method="post" action="{{ request.app.state.ingress_entry }}/setup">
        <label for="username">Benutzername</label>
        <input type="text" name="username" id="username"
               autofocus autocomplete="username" required placeholder="z.B. admin">
        <label for="passwort">{{ _("setup.passwort") }}</label>
        <input type="password" name="passwort" id="passwort"
               autocomplete="new-password" required placeholder="mind. 8 Zeichen">
        <label for="passwort2">{{ _("setup.passwort_wiederholen") }}</label>
        <input type="password" name="passwort2" id="passwort2"
               autocomplete="new-password" required>
        <button type="submit" class="btn">Admin anlegen</button>
    </form>
    <div class="hinweis">
        {{ _("setup.admin_hinweis") }}en.
    </div>
</div>
</body>
</html>
