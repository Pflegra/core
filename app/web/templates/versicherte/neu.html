{% extends "base.html" %}
{% block title %}Neuen Versicherten anlegen – Pflegra{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📂 Neuen Versicherten anlegen</h1>
</div>

{% if fehler %}
<div class="alert alert-fehler">⚠️ {{ fehler }}</div>
{% endif %}

<div class="form-card">
    <form method="post" action="{{ request.app.state.ingress_entry }}/versicherte/speichern">

        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="person_name" required
                       placeholder="Vor- und Nachname" autofocus>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Versicherungsnummer</label>
                <input type="text" name="versicherungsnr" placeholder="z.B. A123456789">
            </div>
            <div class="form-group">
                <label>Pflegegrad</label>
                <select name="pflegegrad">
                    {% for pg in pflegegrade %}
                    <option value="{{ pg }}">{% if pg == 0 %}nicht gesetzt{% else %}Pflegegrad {{ pg }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Geburtsdatum</label>
                <input type="text" name="geburtsdatum" placeholder="TT.MM.JJJJ">
            </div>
            <div class="form-group">
                <label>E-Mail (optional)</label>
                <input type="email" name="mail">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Krankenkasse</label>
                <input type="text" name="krankenkasse" list="kk-liste"
                       placeholder="Krankenkasse eingeben oder wählen">
                <datalist id="kk-liste">
                    {% for kk in krankenkassen %}
                    {% if kk %}<option value="{{ kk }}">{% endif %}
                    {% endfor %}
                </datalist>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Krankenkasse – Postanschrift (für Antrag VP, mehrzeilig)</label>
                <textarea name="krankenkasse_adresse" rows="3"
                          placeholder="z.B.&#10;Pflegekasse&#10;Straße Nr.&#10;PLZ Ort"></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>{{ _("versicherte.adresse") }}</label>
                <textarea name="adresse" rows="2"
                          placeholder="Straße Nr.&#10;PLZ Ort"></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Notiz</label>
                <textarea name="notiz" rows="2"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Anlegen</button>
            <a href="{{ request.app.state.ingress_entry }}/versicherte/" class="btn btn-ghost">{{ _("common.loeschen") }}</a>
        </div>
    </form>
</div>
{% endblock %}
