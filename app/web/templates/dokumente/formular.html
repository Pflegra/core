{% extends "base.html" %}
{% block title %}Dokument hinzufügen – Pflegra{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📁 Dokument hinzufügen</h1>
</div>

<div class="form-card" style="max-width:560px">
    <form method="post" action="{{ request.app.state.ingress_entry }}/dokumente/neu" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label>Person <span style="color:var(--error)">*</span></label>
            <select name="person" required style="width:100%">
                <option value="">Person wählen …</option>
                {% for p in personen %}
                <option value="{{ p }}" {% if person_vorwahl == p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Kategorie</label>
            <select name="kategorie" style="width:100%">
                {% for k, label in kategorien.items() %}
                <option value="{{ k }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Titel <span style="color:var(--error)">*</span></label>
            <input type="text" name="titel" required placeholder="z.B. MD-Gutachten PG2, Bescheid AOK, Widerspruch …" style="width:100%">
        </div>

        <div class="form-group">
            <label>Datum des Dokuments</label>
            <input type="date" name="datum" value="{{ heute }}" style="width:100%">
        </div>

        <div class="form-group">
            <label>Datei <span style="color:var(--error)">*</span></label>
            <input type="file" name="datei" required
                   accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
                   style="width:100%;padding:.4rem;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm)">
            <div style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem">Max. 50 MB · PDF, JPG, PNG, Word</div>
        </div>

        <div class="form-group">
            <label>Notiz</label>
            <input type="text" name="notiz" placeholder="Optionale Bemerkung …" style="width:100%">
        </div>

        <div style="display:flex;gap:.75rem;margin-top:1.25rem">
            <button type="submit" class="btn btn-primary">💾 Speichern</button>
            <a href="{{ request.app.state.ingress_entry }}/dokumente/" class="btn btn-ghost">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
