<div class="form-card" style="padding:.7rem 1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
        <div style="min-width:0">
            <div style="font-weight:600;font-size:.9rem;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                {{ d.titel }}
            </div>
            <div style="font-size:.78rem;color:var(--text-muted)">
                {% if d.datum_de %}{{ d.datum_de }} · {% endif %}
                {{ d.datei_name }} · {{ d.groesse_str }}
                {% if not filter_person and d.person %} · {{ d.person }}{% endif %}
                {% if d.notiz %} · {{ d.notiz }}{% endif %}
            </div>
        </div>
        <div style="display:flex;gap:.35rem;flex-shrink:0">
            <a href="{{ request.app.state.ingress_entry }}/dokumente/{{ d.id }}/herunterladen"
               class="btn btn-ghost btn-sm">⬇ Herunterladen</a>
            <form method="post" action="{{ request.app.state.ingress_entry }}/dokumente/{{ d.id }}/loeschen"
                  onsubmit="return confirm('Dokument wirklich löschen?')">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-ghost btn-sm" style="color:#b91c1c">🗑</button>
            </form>
        </div>
    </div>
</div>
